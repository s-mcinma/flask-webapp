# /etc/httpd/conf.d/webapp.conf   (Amazon Linux 2023)
# Place this file at the path above, then run: sudo systemctl restart httpd

<VirtualHost *:80>
    ServerName  _default_

    # -----------------------------------------------------------------------
    # mod_wsgi daemon process
    # python-home must match: python3 -c "import sys; print(sys.prefix)"
    # python-path must include app dir + all site-package locations from:
    #   python3 -c "import site; print(site.getsitepackages())"
    # -----------------------------------------------------------------------
    WSGIDaemonProcess webapp \
        user=apache \
        group=apache \
        python-path=/var/www/webapp:/usr/local/lib/python3.9/site-packages:/usr/local/lib64/python3.9/site-packages:/usr/lib/python3.9/site-packages:/usr/lib64/python3.9/site-packages \
        python-home=/usr \
        processes=2 \
        threads=5

    WSGIProcessGroup  webapp
    WSGIScriptAlias / /var/www/webapp/webapp.wsgi
    WSGIPassAuthorization On

    # -----------------------------------------------------------------------
    # Static files — served directly by Apache (faster than Flask)
    # -----------------------------------------------------------------------
    Alias /static /var/www/webapp/static

    <Directory /var/www/webapp/static>
        Require all granted
    </Directory>

    <Directory /var/www/webapp>
        <Files webapp.wsgi>
            Require all granted
        </Files>
    </Directory>

    # -----------------------------------------------------------------------
    # Environment variables (alternative to .env file)
    # -----------------------------------------------------------------------
    # Uncomment and fill these in if you prefer not to use a .env file:
    #
    # SetEnv DB_HOST     your-rds-endpoint.region.rds.amazonaws.com
    # SetEnv DB_USER     admin
    # SetEnv DB_PASSWORD your-password
    # SetEnv DB_NAME     webapp_db
    # SetEnv SECRET_KEY  change-this-to-a-long-random-string

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    ErrorLog  /var/log/httpd/webapp_error.log
    CustomLog /var/log/httpd/webapp_access.log combined
</VirtualHost>